name: DBC Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dbc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install cantools
      run: |
        python -m pip install --upgrade pip
        pip install "$(grep -i '^cantools' requirements.txt)"
    - name: Parse DBC files
      run: python scripts/check_dbc.py
